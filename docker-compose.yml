services:
  postgres:
    image: postgres:16-alpine
    container_name: image-search-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-image_search}
      POSTGRES_USER: ${DATABASE_USER:-image_search_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me_for_local_development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - image-search-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./app/backend
    container_name: image-search-backend
    restart: unless-stopped
    environment:
      HOST_NAME: postgres
      DATABASE_NAME: ${DATABASE_NAME:-image_search}
      DATABASE_USER: ${DATABASE_USER:-image_search_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change_me_for_local_development}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_images:/app/images
    networks:
      - image-search-network

  frontend:
    build:
      context: ./app/frontend
    container_name: image-search-frontend
    restart: unless-stopped
    networks:
      - image-search-network

  nginx:
    image: nginx:1.27-alpine
    container_name: image-search-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - image-search-network

networks:
  image-search-network:
    driver: bridge

volumes:
  postgres_data:
  backend_images:
